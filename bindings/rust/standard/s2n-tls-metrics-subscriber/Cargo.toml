[package]
name = "s2n-tls-metrics-subscriber"
version = "0.0.1"
edition = "2024"
description = "Telemetry provider for s2n-tls"
authors = ["AWS s2n"]
repository = "https://github.com/aws/s2n-tls"
license = "Apache-2.0"

[dependencies]
s2n-codec = {git = "https://github.com/aws/s2n-quic"}
static_assertions = "1.1.0"
zerocopy = "0.8.33"
tracing = "0.1.43"

metrique = "0.1.6"
metrique-writer-format-emf = "0.1.6"
metrique-writer = "0.1.7"

arc-swap = "1.8.0"
# we at least need 0.3.33, because that is when the event APIs were introduced
s2n-tls = { version = "0.3.33", path = "../../extended/s2n-tls", features = ["unstable-events", "unstable-testing"] }
s2n-tls-sys = { version = "0.3.33", path = "../../extended/s2n-tls-sys"}

x509-parser = "0.16.0"
x509-cert = { version = "0.2.5", features = ["std"] }
der = "0.7"
openssl = "0.10.77"
openssl-sys = { version = "0.9", features = ["aws-lc"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc"] }
rustls-pki-types = "1"

[dev-dependencies]
s2n-tls-sys-internal = { path = "../s2n-tls-sys-internal" }
serde_json = "1.0"
