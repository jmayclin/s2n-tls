[package]
name = "s2n-ktls"
description = "Kernel TLS (kTLS) support built on top of s2n-tls serialized connections"
version = "0.0.1"
authors = ["AWS s2n"]
edition = "2021"
rust-version = "1.83.0"
repository = "https://github.com/aws/s2n-tls"
license = "Apache-2.0"

[features]
default = []

[dependencies]
# A minimum libc version of 0.2.121 is required by aws-lc-sys 0.14.0.
libc = "0.2.121"
# aws-lc-rs provides the HMAC/HKDF primitives used to re-derive record keys.
aws-lc-rs = "1.13.1"
# s2n-codec provides the panic-free encode/decode buffers used to read and write
# the serialized connection format.
s2n-codec.workspace = true
# thiserror derives the crate's error enum.
thiserror = "2"

[dev-dependencies]
# s2n-tls is only used in tests to generate real serialized connection blobs via
# TestPair. There must be no runtime dependency on s2n-tls. The `unstable-testing`
# feature exposes `s2n_tls::testing::TestPair`; `unstable-ktls` is intentionally
# NOT required, since serialization is available without it.
s2n-tls = { version = "0.3", path = "../../extended/s2n-tls", features = ["unstable-testing"] }
